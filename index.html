<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakacraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c; --bg-alt: #191d24; --surface: #1d222b; --surface-2: #232833;
    --border: #2b3140; --text: #e9e7e2; --text-dim: #9199a8; --text-faint: #5c6474;
    --accent: #e8963b;
    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f1efe9; --bg-alt: #eae7de; --surface: #ffffff; --surface-2: #f3f1eb;
      --border: #d9d5c9; --text: #1c1f26; --text-dim: #565c68; --text-faint: #8a8f9a; --accent: #c26a1c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-display); -webkit-font-smoothing: antialiased; }
  body { background-image: radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 45%), linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%); background-attachment: fixed; min-height: 100vh; }
  a { color: inherit; }
  ::selection { background: var(--accent); color: #14171c; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }
  header.site-nav { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .nav-mark { font-family: var(--font-mono); font-size: 14px; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .nav-mark .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px 1px color-mix(in srgb, var(--accent) 70%, transparent); }
  nav.nav-links { display: flex; gap: 28px; font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
  nav.nav-links a { text-decoration: none; }
  nav.nav-links a:hover { color: var(--accent); }
  .hero { padding: 88px 0 72px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: center; }
  .eyebrow-line { font-family: var(--font-mono); font-size: 13px; color: var(--accent); margin: 0 0 18px; }
  h1.hero-title { font-size: clamp(2.2rem, 5vw, 3.3rem); line-height: 1.1; font-weight: 600; margin: 0 0 22px; letter-spacing: -0.01em; }
  .hero-lede { font-size: 17px; line-height: 1.65; color: var(--text-dim); max-width: 46ch; margin: 0 0 32px; }
  .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn { font-family: var(--font-mono); font-size: 13.5px; padding: 12px 20px; border-radius: 6px; text-decoration: none; display: inline-block; border: 1px solid transparent; }
  .btn-solid { background: var(--accent); color: #17140d; border-color: var(--accent); font-weight: 600; }
  .btn-outline { border-color: var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .terminal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .terminal-bar { display: flex; gap: 7px; padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .terminal-bar span { width: 10px; height: 10px; border-radius: 50%; background: var(--text-faint); opacity: .5; }
  .terminal-body { padding: 20px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.9; color: var(--text-dim); min-height: 150px; }
  .terminal-body .prompt { color: var(--accent); }
  .terminal-body .out { color: var(--text); }
  section { padding: 64px 0; border-top: 1px solid var(--border); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 36px; flex-wrap: wrap; gap: 16px; }
  .section-head h2 { font-size: 1.7rem; font-weight: 600; margin: 0; }
  .section-num { font-family: var(--font-mono); font-size: 13px; color: var(--text-faint); }
  .about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; }
  .about-copy p { font-size: 16px; line-height: 1.75; color: var(--text-dim); margin: 0 0 18px; max-width: 58ch; }
  .stat-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .stat-row { display: flex; justify-content: space-between; padding: 14px 20px; font-family: var(--font-mono); font-size: 13px; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .k { color: var(--text-faint); } .stat-row .v { color: var(--text); text-align: right; }
  .project-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .project-row { display: grid; grid-template-columns: 200px 1fr auto; gap: 24px; align-items: center; padding: 22px 24px; border-bottom: 1px solid var(--border); background: var(--surface); text-decoration: none; color: inherit; }
  .project-row:last-child { border-bottom: none; }
  .project-row:hover { background: var(--surface-2); }
  .project-name { font-family: var(--font-mono); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .project-name::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .project-desc { color: var(--text-dim); font-size: 14.5px; line-height: 1.55; }
  .project-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-self: end; }
  .tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); border: 1px solid var(--border); padding: 4px 9px; border-radius: 5px; white-space: nowrap; }
  .social-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .social-card { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 22px 18px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 10px; }
  .social-card:hover { border-color: var(--accent); }
  .social-icon { width: 22px; height: 22px; color: var(--accent); }
  .social-name { font-family: var(--font-mono); font-size: 14px; font-weight: 600; }
  .social-handle { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
  footer.site-footer { padding: 40px 0 56px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-faint); flex-wrap: wrap; gap: 12px; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .about-grid { grid-template-columns: 1fr; } nav.nav-links { display: none; } }
  @media (max-width: 720px) { .project-row { grid-template-columns: 1fr; gap: 10px; } .project-tags { justify-self: start; } .social-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var ICONS = {
    github: '<svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55v-2.15c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.7-1.28-1.7-1.04-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.03 11.03 0 0 1 5.8 0c2.2-1.49 3.18-1.18 3.18-1.18.63 1.6.23 2.77.11 3.06.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.68.42.36.78 1.08.78 2.18v3.23c0 .3.21.66.79.55C20.21 21.39 23.5 17.08 23.5 12c0-6.27-5.23-11.5-11.5-11.5Z"/></svg>',
    x: '<svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22H16.9l-5-6.5L6 22H2.9l8.1-9.3L1.9 2h6.5l4.5 5.9L18.9 2Zm-1.1 18h1.7L7.2 3.9H5.4L17.8 20Z"/></svg>',
    youtube: '<svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2s-.23-1.64-.94-2.36c-.9-.94-1.9-.95-2.36-1C16.9 2.5 12 2.5 12 2.5h-.01s-4.9 0-8.2.34c-.46.05-1.46.06-2.36 1-.71.72-.94 2.36-.94 2.36S0 8.13 0 10.06v1.72c0 1.93.24 3.86.24 3.86s.23 1.64.94 2.36c.9.94 2.08.91 2.6 1.01 1.9.18 8.06.34 8.06.34s4.9-.01 8.2-.35c.46-.06 1.46-.07 2.36-1.01.71-.72.94-2.36.94-2.36s.24-1.93.24-3.86v-1.72c0-1.93-.24-3.86-.24-3.86ZM9.55 14.6V7.7l6.27 3.46-6.27 3.44Z"/></svg>',
    discord: '<svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3c-.24.44-.5 1.02-.68 1.48a18.2 18.2 0 0 0-5.44 0A11.7 11.7 0 0 0 8.6 3a19.6 19.6 0 0 0-4.9 1.4C1 8.7.3 12.9.6 17.1a19.7 19.7 0 0 0 5.9 3c.48-.65.9-1.35 1.26-2.08-.7-.26-1.36-.58-2-.97.17-.12.33-.25.49-.38 3.85 1.75 8.02 1.75 11.83 0 .16.13.32.26.49.38-.63.39-1.3.71-2 .97.36.73.78 1.43 1.26 2.08a19.6 19.6 0 0 0 5.9-3c.36-4.86-.86-9.02-3.43-12.7ZM9.7 14.6c-1.05 0-1.9-.98-1.9-2.18 0-1.2.83-2.18 1.9-2.18s1.92.99 1.9 2.18c0 1.2-.83 2.18-1.9 2.18Zm5.6 0c-1.05 0-1.9-.98-1.9-2.18 0-1.2.83-2.18 1.9-2.18s1.92.99 1.9 2.18c0 1.2-.83 2.18-1.9 2.18Z"/></svg>',
    other: '<svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12a5 5 0 0 1 5-5h3v2h-3a3 3 0 1 0 0 6h3v2h-3a5 5 0 0 1-5-5Zm7-1h6v2h-6v-2Zm3-4h3a5 5 0 0 1 0 10h-3v-2h3a3 3 0 1 0 0-6h-3V7Z"/></svg>'
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderView(data) {
    var termHtml = data.terminal.map(function (l) {
      return '<div><span class="prompt">' + esc(l.prompt) + '</span></div><div class="out">' + esc(l.out) + '</div>';
    }).join("");
    var aboutParas = data.about.paragraphs.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    var statRows = data.about.stats.map(function (s) {
      return '<div class="stat-row"><span class="k">' + esc(s.k) + '</span><span class="v">' + esc(s.v) + "</span></div>";
    }).join("");
    var projectRows = data.projects.map(function (p) {
      var tags = (p.tags || "").split(",").map(function (t) { return t.trim(); }).filter(Boolean)
        .map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
      return '<a class="project-row" href="' + esc(p.url || "#") + '">' +
        '<span class="project-name">' + esc(p.name) + "</span>" +
        '<span class="project-desc">' + esc(p.desc) + "</span>" +
        '<span class="project-tags">' + tags + "</span></a>";
    }).join("");
    var socialCards = data.socials.map(function (s) {
      var icon = ICONS[s.icon] || ICONS.other;
      return '<a class="social-card" href="' + esc(s.url || "#") + '">' + icon +
        '<span class="social-name">' + esc(s.name) + "</span>" +
        '<span class="social-handle">' + esc(s.handle) + "</span></a>";
    }).join("");

    return '' +
      '<header class="site-nav"><div class="wrap nav-inner">' +
        '<a class="nav-mark" href="#top"><span class="dot"></span>jakacraft</a>' +
        '<nav class="nav-links"><a href="#about">about</a><a href="#projects">projects</a><a href="#contact">contact</a></nav>' +
      "</div></header>" +
      '<main id="top"><div class="wrap hero"><div>' +
        '<p class="eyebrow-line">' + esc(data.hero.eyebrow) + "</p>" +
        '<h1 class="hero-title">' + esc(data.hero.title) + "</h1>" +
        '<p class="hero-lede">' + esc(data.hero.lede) + "</p>" +
        '<div class="hero-actions"><a class="btn btn-solid" href="#projects">See what I\'ve built</a><a class="btn btn-outline" href="#contact">Get in touch</a></div>' +
      "</div>" +
      '<div class="terminal" aria-hidden="true"><div class="terminal-bar"><span></span><span></span><span></span></div>' +
      '<div class="terminal-body">' + termHtml + "</div></div></div>" +
      '<section id="about"><div class="wrap about-grid"><div>' +
        '<div class="section-head"><h2>About</h2><span class="section-num">01</span></div>' +
        '<div class="about-copy">' + aboutParas + "</div></div>" +
        '<div class="stat-panel">' + statRows + "</div></div></section>" +
      '<section id="projects"><div class="wrap">' +
        '<div class="section-head"><h2>Projects</h2><span class="section-num">02</span></div>' +
        '<div class="project-list">' + projectRows + "</div></div></section>" +
      '<section id="contact"><div class="wrap">' +
        '<div class="section-head"><h2>Find me elsewhere</h2><span class="section-num">03</span></div>' +
        '<div class="social-grid">' + socialCards + "</div></div></section></main>" +
      '<footer class="site-footer wrap"><span>&copy; <span id="year"></span> Jakacraft</span>' +
      "<span>built with code, coffee, and a little stubbornness</span></footer>";
  }

  function typeIntro(data) {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var body = document.querySelector(".terminal-body");
    if (!body || reduce) return;
    var lines = data.terminal, i = 0;
    body.innerHTML = "";
    function next() {
      if (i >= lines.length) return;
      var l = lines[i], pDiv = document.createElement("div"), pSpan = document.createElement("span");
      pSpan.className = "prompt"; pDiv.appendChild(pSpan); body.appendChild(pDiv);
      var j = 0;
      (function typeP() {
        pSpan.textContent = l.prompt.slice(0, j); j++;
        if (j <= l.prompt.length) { setTimeout(typeP, 32); return; }
        setTimeout(function () {
          var oDiv = document.createElement("div"); oDiv.className = "out"; body.appendChild(oDiv);
          var k = 0;
          (function typeO() {
            oDiv.textContent = l.out.slice(0, k); k++;
            if (k <= l.out.length) { setTimeout(typeO, 18); return; }
            i++; setTimeout(next, 250);
          })();
        }, 150);
      })();
    }
    next();
  }

  fetch("content/site.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById("app").innerHTML = renderView(data);
      var y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
      typeIntro(data);
    })
    .catch(function (err) {
      document.getElementById("app").innerHTML = '<p style="padding:40px;font-family:monospace;color:#e8593b;">Couldn\'t load site content.</p>';
      console.error(err);
    });
})();
</script>
</body>
</html>
