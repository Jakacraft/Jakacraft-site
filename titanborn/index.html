<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titanborn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c; --surface: #1d222b; --surface-2: #232833; --border: #2b3140;
    --text: #e9e7e2; --text-dim: #9199a8; --text-faint: #5c6474; --accent: #e8963b; --danger: #e8593b;
    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-display); }
  a { color: inherit; }
  .center-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate { width: 100%; max-width: 380px; text-align: center; }
  .gate .mark { font-family: var(--font-mono); color: var(--text-faint); font-size: 13px; margin-bottom: 22px; letter-spacing: .04em; }
  .gate h1 { font-size: 1.6rem; margin: 0 0 8px; }
  .gate p.sub { color: var(--text-dim); font-size: 14px; margin: 0 0 26px; }
  .gate input[type="password"] {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 13px 14px; border-radius: 8px; font-family: var(--font-mono); font-size: 15px; margin-bottom: 12px;
    text-align: center; letter-spacing: .05em;
  }
  .gate input:focus { outline: none; border-color: var(--accent); }
  .gate button {
    width: 100%; background: var(--accent); color: #17140d; border: none; padding: 13px 14px;
    border-radius: 8px; font-family: var(--font-mono); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .gate button:disabled { opacity: .6; cursor: default; }
  .gate .err { color: var(--danger); font-family: var(--font-mono); font-size: 12.5px; margin-top: 14px; min-height: 16px; }

  .vault { display: none; min-height: 100vh; }
  .vault.show { display: grid; grid-template-columns: 260px 1fr; }
  .sidebar { border-right: 1px solid var(--border); background: var(--surface); padding: 20px 0; overflow-y: auto; }
  .sidebar-head { display: flex; justify-content: space-between; align-items: center; padding: 0 18px 16px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .sidebar-head .mark { font-family: var(--font-mono); font-size: 13px; color: var(--text-faint); }
  .lock-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 11.5px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .lock-btn:hover { border-color: var(--danger); color: var(--danger); }
  .folder { padding: 10px 18px 4px; font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
  .file-item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text-dim); font-family: var(--font-mono); font-size: 13.5px; padding: 9px 18px; cursor: pointer; border-left: 2px solid transparent; }
  .file-item:hover { background: var(--surface-2); color: var(--text); }
  .file-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface-2); }
  .empty-note { padding: 20px 18px; color: var(--text-faint); font-family: var(--font-mono); font-size: 12.5px; }

  .reader { padding: 40px 48px; overflow-y: auto; }
  .reader h2 { margin: 0 0 20px; font-size: 1.4rem; }
  .reader pre {
    white-space: pre-wrap; word-wrap: break-word; font-family: var(--font-mono); font-size: 14px;
    line-height: 1.7; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 24px; margin: 0;
  }
  .placeholder { color: var(--text-faint); font-family: var(--font-mono); font-size: 13.5px; }

  @media (max-width: 720px) {
    .vault.show { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    .reader { padding: 24px; }
  }
</style>
</head>
<body>

<div class="center-wrap" id="gateWrap">
  <div class="gate">
    <div class="mark">titanborn</div>
    <h1>Locked</h1>
    <p class="sub">Enter the password to continue.</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <div class="err" id="errMsg"></div>
  </div>
</div>

<div class="vault" id="vaultWrap">
  <div class="sidebar" id="sidebar"></div>
  <div class="reader" id="reader"><p class="placeholder">Select a file to read it.</p></div>
</div>

<script>
(function () {
  "use strict";

  function bytesToBase64(bytes) {
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function base64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(password, saltB64, iterations) {
    var enc = new TextEncoder();
    var salt = base64ToBytes(saltB64);
    var keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptVault(vaultFile, password) {
    var key = await deriveKey(password, vaultFile.salt, vaultFile.iterations);
    var iv = base64ToBytes(vaultFile.iv);
    var data = base64ToBytes(vaultFile.data);
    var plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderSidebar(vault) {
    var sidebar = document.getElementById("sidebar");
    var html = '<div class="sidebar-head"><span class="mark">titanborn</span><button class="lock-btn" id="lockBtn">Lock</button></div>';

    var hasAny = (vault.files && vault.files.length) || (vault.folders && vault.folders.length);
    if (!hasAny) {
      html += '<div class="empty-note">No files yet.</div>';
    }

    if (vault.files && vault.files.length) {
      vault.files.forEach(function (f, i) {
        html += '<button class="file-item" data-kind="root" data-idx="' + i + '">' + esc(f.name) + "</button>";
      });
    }
    if (vault.folders && vault.folders.length) {
      vault.folders.forEach(function (folder, fi) {
        html += '<div class="folder">' + esc(folder.name) + "</div>";
        (folder.files || []).forEach(function (f, i) {
          html += '<button class="file-item" data-kind="folder" data-fidx="' + fi + '" data-idx="' + i + '">' + esc(f.name) + "</button>";
        });
      });
    }
    sidebar.innerHTML = html;

    document.getElementById("lockBtn").addEventListener("click", lockVault);
    sidebar.querySelectorAll(".file-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        sidebar.querySelectorAll(".file-item").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        var file;
        if (btn.dataset.kind === "root") {
          file = vault.files[+btn.dataset.idx];
        } else {
          file = vault.folders[+btn.dataset.fidx].files[+btn.dataset.idx];
        }
        showFile(file);
      });
    });
  }

  function showFile(file) {
    var reader = document.getElementById("reader");
    reader.innerHTML = "<h2>" + esc(file.name) + "</h2><pre>" + esc(file.content) + "</pre>";
  }

  function lockVault() {
    document.getElementById("vaultWrap").classList.remove("show");
    document.getElementById("gateWrap").style.display = "flex";
    document.getElementById("pwInput").value = "";
    document.getElementById("errMsg").textContent = "";
    document.getElementById("sidebar").innerHTML = "";
    document.getElementById("reader").innerHTML = '<p class="placeholder">Select a file to read it.</p>';
  }

  async function attemptUnlock() {
    var pw = document.getElementById("pwInput").value;
    var errEl = document.getElementById("errMsg");
    var btn = document.getElementById("unlockBtn");
    errEl.textContent = "";
    if (!pw) return;
    btn.disabled = true;
    btn.textContent = "Checking...";
    try {
      var res = await fetch("../content/titanborn/vault.json", { cache: "no-store" });
      if (!res.ok) {
        errEl.textContent = "No vault found yet.";
        btn.disabled = false; btn.textContent = "Unlock";
        return;
      }
      var vaultFile = await res.json();
      var vault = await decryptVault(vaultFile, pw);
      document.getElementById("gateWrap").style.display = "none";
      document.getElementById("vaultWrap").classList.add("show");
      renderSidebar(vault);
    } catch (e) {
      errEl.textContent = "Incorrect password.";
    }
    btn.disabled = false;
    btn.textContent = "Unlock";
  }

  document.getElementById("unlockBtn").addEventListener("click", attemptUnlock);
  document.getElementById("pwInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") attemptUnlock();
  });
})();
</script>

</body>
</html>
